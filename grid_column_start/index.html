<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>grid-column-start Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Ví dụ 1: grid-column-start: auto</h1>
    <div class="grid-container example1">
        <div class="item1">Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div>

    <h1>Ví dụ 2: grid-column-start: span 2</h1>
    <div class="grid-container example2">
        <div class="item1">Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>

    <h1>Ví dụ 3: grid-column-start: 2</h1>
    <div class="grid-container example3">
        <div class="item1">Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>
</body>
</html>

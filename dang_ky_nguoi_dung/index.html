<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Ký Người Dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Bootstrap Carousel hiển thị lợi ích dịch vụ -->
    <div id="benefitCarousel" class="carousel slide mt-4" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <img src="https://via.placeholder.com/600x400?text=Loi+ich+1" class="d-block w-100" alt="Lợi ích 1">
                        </div>
                        <div class="col-md-6">
                            <h2>Giao diện hiện đại</h2>
                            <p>Thiết kế responsive, tối ưu cho mọi thiết bị.</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="carousel-item">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <img src="https://via.placeholder.com/600x400?text=Loi+ich+2" class="d-block w-100" alt="Lợi ích 2">
                        </div>
                        <div class="col-md-6">
                            <h2>Bảo mật cao</h2>
                            <p>Hệ thống mã hóa bảo vệ thông tin người dùng tuyệt đối.</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="carousel-item">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <img src="https://via.placeholder.com/600x400?text=Loi+ich+3" class="d-block w-100" alt="Lợi ích 3">
                        </div>
                        <div class="col-md-6">
                            <h2>Hỗ trợ 24/7</h2>
                            <p>Đội ngũ chăm sóc khách hàng luôn sẵn sàng hỗ trợ.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#benefitCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Trước</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#benefitCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Tiếp theo</span>
        </button>
    </div>

    <!-- Form đăng ký người dùng -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="mb-0"><i class="fas fa-user-plus me-2"></i>Đăng ký tài khoản</h3>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Họ và tên</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" id="fullName" placeholder="Nhập họ và tên" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="Nhập email" required>
                                </div>
                                <div class="form-text">Chúng tôi sẽ không chia sẻ email của bạn.</div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="fas fa-paper-plane me-2"></i>Đăng ký ngay
                            </button>
                        </form>
                    </div>
                    <div class="card-footer text-center text-muted">
                        Đã có tài khoản? <a href="#" class="text-decoration-none fw-bold">Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

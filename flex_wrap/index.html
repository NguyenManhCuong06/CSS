<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>flex-wrap Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Ví dụ 1: flex-wrap: wrap</h1>
    <div class="container wrap">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
        <div>Item 6</div>
    </div>

    <h1>Ví dụ 2: flex-wrap: nowrap</h1>
    <div class="container nowrap">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>

    <h1>Ví dụ 3: flex-wrap: wrap-reverse</h1>
    <div class="container wrap-reverse">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
        <div>Item 6</div>
    </div>

    <h1>Ví dụ 4: flex-wrap: initial</h1>
    <div class="container initial">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>
</body>
</html>

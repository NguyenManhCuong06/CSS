<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Ký - Bootstrap Forms</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h2 class="mb-0">Đăng ký tài khoản</h2>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="hoten" class="form-label">Họ và tên</label>
                                <input type="text" class="form-control" id="hoten" placeholder="Nhập họ và tên">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Nhập email">
                                <div class="form-text text-muted">Chúng tôi sẽ không chia sẻ email của bạn với bất kỳ ai.</div>
                            </div>

                            <div class="mb-3">
                                <label for="matkhau" class="form-label">Mật khẩu</label>
                                <input type="password" class="form-control" id="matkhau" placeholder="Nhập mật khẩu">
                            </div>

                            <div class="mb-3">
                                <label for="xacnhanmatkhau" class="form-label">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="xacnhanmatkhau" placeholder="Nhập lại mật khẩu">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Giới tính</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="gioitinh" id="nam" value="nam">
                                    <label class="form-check-label" for="nam">Nam</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="gioitinh" id="nu" value="nu">
                                    <label class="form-check-label" for="nu">Nữ</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="gioitinh" id="khac" value="khac">
                                    <label class="form-check-label" for="khac">Khác</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Sở thích</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="thethao" value="thethao">
                                    <label class="form-check-label" for="thethao">Thể thao</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="amnhac" value="amnhac">
                                    <label class="form-check-label" for="amnhac">Âm nhạc</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="dulich" value="dulich">
                                    <label class="form-check-label" for="dulich">Du lịch</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="quocgia" class="form-label">Quốc gia</label>
                                <select class="form-select" id="quocgia">
                                    <option selected>Chọn quốc gia</option>
                                    <option value="vietnam">Viet Nam</option>
                                    <option value="my">Mỹ</option>
                                    <option value="nhatban">Nhật Bản</option>
                                    <option value="hanquoc">Hàn Quốc</option>
                                    <option value="khac">Khác</option>
                                </select>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Đăng ký</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center text-muted">
                        Đã có tài khoản? <a href="#" class="text-decoration-none">Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

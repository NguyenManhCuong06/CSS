<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-basis Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Ví dụ 1: flex-basis với đơn vị px</h1>
    <div class="container example1">
        <div class="item item1">Item 1</div>
        <div class="item item2">Item 2</div>
        <div class="item item3">Item 3</div>
    </div>

    <h1>Ví dụ 2: flex-basis với flex-direction: column</h1>
    <div class="container example2 column">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>

    <h1>Ví dụ 3: flex-basis với %</h1>
    <div class="container example3">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
    </div>

    <h1>Ví dụ 4: Kết hợp flex-basis với flex-grow</h1>
    <div class="container example4">
        <div class="item item1">Item 1</div>
        <div class="item item2">Item 2</div>
        <div class="item item3">Item 3</div>
    </div>
</body>
</html>

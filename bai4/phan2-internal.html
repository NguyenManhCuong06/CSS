<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 4 - Phần 2: Internal Style</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            line-height: 1.6;
        }

        h1 {
            color: #4CAF50;
        }

        p {
            color: #2196F3;
            font-size: 18px;
        }

        strong {
            color: #E91E63;
        }
    </style>
</head>

<body>

    <h1>Bài 4 - Nhúng CSS vào trang HTML</h1>

    <p>
        Phần 2: Thay đổi màu sắc văn bản bằng <strong>internal-style</strong>
        — định nghĩa CSS trong thẻ <i>&lt;style&gt;</i> nằm trong thẻ <i>&lt;head&gt;</i>.
    </p>

</body>

</html>
